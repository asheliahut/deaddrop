name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN: deaddrop

jobs:
  check-version:
    name: check tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compare versions
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi
      - name: Check CHANGELOG.md has this release
        run: packaging/changelog-section.sh "$GITHUB_REF_NAME" > /dev/null

  build:
    name: build ${{ matrix.target }}
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (glibc)
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          # Linux (static musl)
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          # macOS
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          # Windows
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # sign attestations via Sigstore
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="$BIN-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$BIN" "dist/$name/"
          cp README.md CHANGELOG.md config.example.toml "dist/$name/"
          [ -f LICENSE ] && cp LICENSE* "dist/$name/" || true
          cd dist
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      # Signed SLSA provenance for the binary and the tarball, stored by GitHub.
      # Verify with: gh attestation verify <file> --repo asheliahut/deaddrop
      - name: Attest build provenance (unix)
        if: runner.os != 'Windows'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            target/${{ matrix.target }}/release/${{ env.BIN }}
            dist/*.tar.gz

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "$env:BIN-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN.exe" "dist/$name/"
          Copy-Item README.md, CHANGELOG.md, config.example.toml "dist/$name/"
          if (Test-Path LICENSE*) { Copy-Item LICENSE* "dist/$name/" }
          Set-Location dist
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Combined checksums
        run: cd dist && cat *.sha256 > SHA256SUMS

      - name: Release notes from CHANGELOG.md
        run: packaging/changelog-section.sh "$GITHUB_REF_NAME" > release-notes.md

      - name: Render Homebrew formula
        run: packaging/homebrew/render-formula.sh "$GITHUB_REF_NAME" dist/SHA256SUMS > dist/deaddrop.rb

      - uses: softprops/action-gh-release@v3.0.4
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Pushes the formula to asheliahut/homebrew-tap so `brew install
      # asheliahut/tap/deaddrop` picks up the release. Needs a fine-grained PAT
      # with Contents: read/write on that repo only, stored as HOMEBREW_TAP_TOKEN.
      # Skipped for prereleases and when the secret isn't set.
      - name: Update Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: asheliahut/homebrew-tap
        shell: bash
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set; skipping tap update (formula is attached to the release)"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp dist/deaddrop.rb tap/Formula/deaddrop.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/deaddrop.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged"
            exit 0
          fi
          git commit -m "deaddrop ${GITHUB_REF_NAME}"
          git push
