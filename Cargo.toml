[package]
name = "deaddrop"
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Leech a torrent on a server without seeding, and hand it to one client peer-to-peer over iroh, optionally age-encrypted."
license = "Unlicense"
homepage = "https://deaddrop.rip"
repository = "https://github.com/asheliahut/deaddrop"

[dependencies]
age = "0.12.1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
directories = "6"
indicatif = "0.18.6"
iroh = "1.4.1"
iroh-blobs = "0.104.1"
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls", "disable-upload"] }
n0-future = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io-util", "io"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
